name: fin_dwh
version: "1.0.0"
config-version: 2
profile: fin_dwh

model-paths: ["models"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Biên an toàn (phút) cho mốc incremental của các bảng fact: lấy thêm dữ liệu nạp
  # trong N phút trước mốc lần chạy trước. 0 là đủ khi loader và dbt chạy tuần tự
  # (như DAG này); tăng lên nếu loader có thể commit song song với lúc dbt chạy.
  load_lookback_minutes: 0

models:
  fin_dwh:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
      # Sau khi build mỗi model trong marts: bật RLS + tạo view che PII ở schema secure
      +post-hook: "{{ apply_governance() }}"

snapshots:
  fin_dwh:
    +target_schema: snapshots

data_tests:
  fin_dwh:
    +store_failures: false
